name: nbb_mobile
description: New Baby Born mobile prototype (Flutter WebView)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/www/Views/Mobile/
    - assets/www/wwwroot/css/
    - assets/www/wwwroot/data/
    - assets/www/wwwroot/js/
    - assets/www/
