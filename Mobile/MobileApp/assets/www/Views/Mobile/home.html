<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Beranda — New Baby Born</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
  <style>
    .hero {
      background: linear-gradient(135deg, #004d35 0%, #005D41 60%, #00734F 100%);
      color: #fff;
      padding: 20px 20px 28px;
    }
    .hero .name { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
    .hero .role { font-size: 13px; opacity: .9; }
    .body-pad { padding: 16px; margin-top: -12px; }
  </style>
</head>
<body>
<div class="mobile-wrapper">
  <div class="mobile-content">
    <div class="hero">
      <span class="nbb-chip"><i class="fa-solid fa-baby"></i> NEW BABY BORN</span>
      <div class="name" id="nama">—</div>
      <div class="role" id="role">BR · Falcon Mobile</div>
    </div>
    <div class="body-pad">
      <div class="stat-row mb-3">
        <div class="stat-box"><div class="num" id="cDraft">0</div><div class="lbl">Draft foto</div></div>
        <div class="stat-box"><div class="num" id="cSent">0</div><div class="lbl">Terkirim</div></div>
      </div>
      <div class="card-soft">
        <h6 class="mb-1" style="font-weight:700">Ambil data baru</h6>
        <p class="small text-muted mb-3">Foto buku baby born → OCR list → verifikasi baris → kirim 1 foto.</p>
        <a href="capture.html" class="btn btn-primary-nbb"><i class="fa-solid fa-camera me-2"></i>Foto buku baby born</a>
        <button type="button" id="btnManual" class="btn btn-outline-nbb mt-2">
          <i class="fa-solid fa-keyboard me-2"></i>Input manual
        </button>
      </div>
      <div class="card-soft">
        <h6 class="mb-1" style="font-weight:700">Riwayat & kirim</h6>
        <p class="small text-muted mb-3">Lihat batch foto, lanjutkan verifikasi, atau kirim ulang yang gagal.</p>
        <a href="history.html" class="btn btn-outline-nbb"><i class="fa-solid fa-list me-2"></i>Buka riwayat</a>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="home.html" class="active"><i class="fa-solid fa-house"></i>Beranda</a>
    <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i>Riwayat</a>
    <a href="profil.html"><i class="fa-solid fa-user"></i>Profil</a>
  </nav>
</div>
<script src="../../wwwroot/js/nbb-store.js"></script>
<script>
  const s = NbbStore.requireSession();
  if (!s) throw new Error('no session');
  document.getElementById('nama').textContent = s.nama;
  document.getElementById('role').textContent = 'BR · ' + s.username + ' · Falcon + NBB';
  const c = NbbStore.counts();
  document.getElementById('cDraft').textContent = c.draft + c.failed;
  document.getElementById('cSent').textContent = c.submitted;
  NbbStore.ensureMasters();
  document.getElementById('btnManual').onclick = async () => {
    const btn = document.getElementById('btnManual');
    btn.disabled = true;
    try {
      await NbbStore.createManualBatch();
      location.href = 'list.html';
    } catch (e) {
      btn.disabled = false;
      alert(String(e.message || e));
    }
  };
</script>
</body>
</html>
