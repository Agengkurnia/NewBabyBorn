<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Riwayat — New Baby Born</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
</head>
<body>
<div class="mobile-wrapper">
  <div class="mobile-header">
    <a href="home.html"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="title">Riwayat foto</div>
    <span class="nbb-chip" style="font-size:10px;padding:2px 8px">NBB</span>
  </div>
  <div class="mobile-content">
    <div style="padding:16px">
      <div class="filter-chips" id="filters">
        <button type="button" data-f="all" class="active">Semua</button>
        <button type="button" data-f="draft">Draft</button>
        <button type="button" data-f="submitted">Terkirim</button>
        <button type="button" data-f="failed">Gagal</button>
      </div>
      <div id="list"></div>
      <div id="empty" class="text-center text-muted py-5" style="display:none">
        <i class="fa-solid fa-inbox fa-2x mb-2"></i>
        <div>Belum ada foto batch</div>
        <a href="capture.html" class="btn btn-primary-nbb mt-3" style="max-width:220px;margin:16px auto 0">Ambil data baru</a>
      </div>
    </div>
  </div>
  <div id="toast" class="toast-nbb"></div>
  <div class="loading-overlay" id="loading">
    <div class="spinner-border text-success"></div>
    <div style="font-weight:600;color:#005D41">Mengirim batch foto…</div>
  </div>
  <nav class="bottom-nav">
    <a href="home.html"><i class="fa-solid fa-house"></i>Beranda</a>
    <a href="history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i>Riwayat</a>
    <a href="profil.html"><i class="fa-solid fa-user"></i>Profil</a>
  </nav>
</div>
<script src="../../wwwroot/js/nbb-store.js"></script>
<script src="../../wwwroot/js/nbb-api.js"></script>
<script>
(() => {
  NbbStore.requireSession();
  let filter = 'all';
  let masters = null;

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  const q = new URLSearchParams(location.search);
  if (q.get('saved') === '1') {
    toast('Draft foto tersimpan');
    history.replaceState({}, '', 'history.html');
  }
  if (q.get('sent') === '1') {
    toast('Batch foto berhasil dikirim');
    history.replaceState({}, '', 'history.html');
  }

  function statusPill(st) {
    const map = { draft: 'Draft', submitted: 'Terkirim', failed: 'Gagal' };
    return `<span class="status-pill ${st}">${map[st] || st}</span>`;
  }

  async function resubmit(batchId) {
    document.getElementById('loading').classList.add('show');
    const res = await NbbApi.submitBatch(batchId);
    document.getElementById('loading').classList.remove('show');
    toast(res.message);
    render();
  }

  function render() {
    const list = NbbStore.listBatches().filter((x) => filter === 'all' || x.status === filter);
    const box = document.getElementById('list');
    const empty = document.getElementById('empty');

    if (!list.length) {
      box.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    box.innerHTML = list.map((b) => {
      const rs = masters ? NbbStore.labelOf(masters, 'sumberData', b.sumberDataId) : b.sumberDataId;
      const when = new Date(b.updatedAt || b.createdAt).toLocaleString('id-ID');
      const vc = NbbStore.verifiedCounts(b);
      const canSend = NbbStore.canSubmitBatch(b).ok && (b.status === 'draft' || b.status === 'failed');
      const sendBtn = canSend
        ? `<button type="button" class="btn btn-sm btn-primary-nbb mt-2 btn-resend" data-id="${b.id}" style="padding:8px;width:auto">Kirim ulang</button>`
        : '';
      return `<div class="history-item history-batch" data-open="${b.id}">
        ${b.photoDataUrl
          ? `<img src="${b.photoDataUrl}" alt=""/>`
          : `<div class="history-thumb-empty"><i class="fa-solid fa-keyboard"></i></div>`}
        <div class="meta">
          <h6>${b.inputMode === 'manual' || !b.photoDataUrl ? 'Input manual' : (rs || 'Foto batch')} · ${vc.total} baris</h6>
          <p>${vc.verified}/${vc.total} verified · ${when}</p>
          <div class="mt-1">${statusPill(b.status)}${b.lastError ? ' <span class="small text-danger">' + b.lastError + '</span>' : ''}</div>
          ${sendBtn}
        </div>
      </div>`;
    }).join('');

    box.querySelectorAll('.btn-resend').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        resubmit(btn.dataset.id);
      });
    });
    box.querySelectorAll('.history-batch').forEach((row) => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.btn-resend')) return;
        const id = row.dataset.open;
        const b = NbbStore.getBatch(id);
        if (!b) return;
        if (b.status === 'submitted') {
          toast('Batch sudah terkirim');
          return;
        }
        NbbStore.openBatchForEdit(id);
        location.href = 'list.html?batchId=' + encodeURIComponent(id);
      });
    });
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-f]');
    if (!btn) return;
    filter = btn.dataset.f;
    document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('active', b === btn));
    render();
  });

  NbbStore.ensureMasters().then((m) => { masters = m; render(); });
})();
</script>
</body>
</html>
